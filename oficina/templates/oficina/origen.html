{% extends "oficina/base.html" %}
{% block titulo %}{{ titulo }} · Trazabilidad de planta{% endblock %}
{% block contenido %}
<div class="encabezado"><h1>{{ titulo }}</h1></div>
<form class="filtros" method="get" action="{{ request.path }}"
      hx-get="{{ request.path }}" hx-target="#tabla" hx-trigger="input changed delay:300ms" hx-push-url="true">
  <input type="search" name="q" value="{{ q }}" placeholder="Buscar plano, cliente o número" aria-label="Buscar">
  <noscript><button class="boton">Buscar</button></noscript>
</form>
<div id="tabla">{% include tabla %}</div>
{% endblock %}
