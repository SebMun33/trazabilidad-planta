{% extends "kiosco/base.html" %}
{% block titulo_kiosco %}Confirmar{% endblock %}
{% block contenido %}
<form method="post" action="{{ url }}" class="tarjeta k-confirmar">
  {% csrf_token %}
  <h1>{{ pregunta }}</h1>
  <p class="suave">Op. {{ op.nro }} · {{ t.plano }}</p>
  <input type="hidden" name="accion" value="{{ datos.accion }}">
  <input type="hidden" name="maquina_id" value="{{ datos.maquina_id|default_if_none:'' }}">
  <input type="hidden" name="observaciones" value="{{ datos.observaciones }}">
  <input type="hidden" name="confirmado" value="1">
  <div class="k-acciones">
    <button class="k-boton k-inicio" data-tecla="Enter" autofocus><kbd>Enter</kbd> Sí</button>
    <a class="k-boton" href="{{ url }}" data-tecla="Escape"><kbd>Esc</kbd> No</a>
  </div>
</form>
{% endblock %}
