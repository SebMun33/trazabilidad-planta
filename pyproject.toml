[project]
name = "trazabilidad-planta"
version = "0.1.0"
description = "Registro de avance de producción en planta y preparación de trabajos pendientes para una tornería."
authors = [{ name = "SebMun33" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "django-htmx>=1.21",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S608"]
# Las columnas de texto opcionales son NULL a propósito: es el contrato con el
# data warehouse (NULL = sin dato). Ver docs/decisiones/0005-esquemas-y-search-path.md.
"planta/models.py" = ["DJ001"]
"config/settings/*.py" = ["F405", "F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]
